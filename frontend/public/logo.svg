<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="500" height="550">
  <rect width="500" height="550" fill="#0c0c0e" />
  
  <!-- Icon Frame -->
  <rect x="130" y="45" width="240" height="240" rx="42" ry="42" fill="none" stroke="#f59e0b" stroke-width="16" />
  
  <!-- Z & E Stylized Mark -->
